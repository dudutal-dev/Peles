name = "palas-push"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "palas-push"
database_id = "REPLACE_WITH_D1_ID"

[vars]
ALLOWED_ORIGINS = "https://dudutal-dev.github.io,http://localhost:4188,http://localhost:5188"
VAPID_SUBJECT = "https://dudutal-dev.github.io/Peles/"
MAX_DEVICES = "10"

# Secret (never in this file): VAPID_PRIVATE_JWK — set with `node scripts/setup-vapid.mjs`.
